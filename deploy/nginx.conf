server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Seguridad básica
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # El API se busca al momento de cada pedido (DNS interno de Docker): si el contenedor "api" está caído,
  # la web igual arranca y muestra la pantalla de "sistema no disponible" en lugar de no levantar.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream api:5000;

  # Modo mantenimiento: existe /usr/share/nginx/estado/mantenimiento.json (carpeta ./estado del proyecto,
  # se prende y apaga con: bash scripts/mantenimiento.sh on|off).
  set $mantenimiento 0;
  if (-f /usr/share/nginx/estado/mantenimiento.json) { set $mantenimiento 1; }

  # Pantallas de estado (caído / mantenimiento) y el aviso de mantenimiento: siempre disponibles.
  location /estado/ {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }
  location = /estado/mantenimiento.json {
    root /usr/share/nginx;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  # Salud y apariencia responden también en mantenimiento (las usan las pantallas de estado).
  location ~ ^/api/(health|apariencia|acceso)$ {
    # En mantenimiento solo consultas: guardar la apariencia también espera.
    set $bloqueo "${mantenimiento}${request_method}";
    if ($bloqueo ~ ^1(POST|PUT|PATCH|DELETE)) { return 503; }
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_pass_header Set-Cookie;
    error_page 502 504 = @api_caida;
    error_page 503 = @api_mantenimiento;
  }

  # API → backend
  location /api/ {
    if ($mantenimiento) { return 503; }
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_pass_header Set-Cookie;
    error_page 502 504 = @api_caida;
    error_page 503 = @api_mantenimiento;
  }
  location @api_caida {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "10" always;
    return 503 '{"message":"El sistema no está disponible en este momento.","codigo":"caido"}';
  }
  location @api_mantenimiento {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "30" always;
    return 503 '{"message":"El sistema está en mantenimiento.","codigo":"mantenimiento"}';
  }

  # App instalable: el service worker y el manifiesto nunca se guardan en caché
  # (si no, las actualizaciones tardarían días en llegar).
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # SPA (en mantenimiento: la pantalla de mantenimiento, con estado 503)
  location / {
    if ($mantenimiento) { return 503; }
    try_files $uri $uri/ /index.html;
  }
  error_page 503 /estado/mantenimiento.html;

  # Cache estáticos
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
