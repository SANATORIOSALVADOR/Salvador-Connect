services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sanatorio
      POSTGRES_PASSWORD: sanatorio
      POSTGRES_DB: sanatorio_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanatorio -d sanatorio_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: postgresql://sanatorio:sanatorio@db:5432/sanatorio_db
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
