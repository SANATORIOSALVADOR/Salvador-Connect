openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Sanatorio del Salvador internal management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard summaries and activity
  - name: agenda
    description: Administrative agenda and reminders
  - name: directory
    description: Users and sectors
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent activity
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 6
      responses:
        "200":
          description: Recent activity entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /sectors:
    get:
      operationId: listSectors
      tags: [directory]
      summary: List available sectors
      responses:
        "200":
          description: Sectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sector"
  /me:
    get:
      operationId: getCurrentUser
      tags: [directory]
      summary: Get the current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
  /agenda:
    get:
      operationId: listAgendaItems
      tags: [agenda]
      summary: List administrative agenda items
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AgendaType"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AgendaStatus"
      responses:
        "200":
          description: Agenda items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgendaItem"
    post:
      operationId: createAgendaItem
      tags: [agenda]
      summary: Create an agenda item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgendaItemInput"
      responses:
        "201":
          description: Created agenda item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgendaItem"
  /agenda/{id}:
    patch:
      operationId: updateAgendaItem
      tags: [agenda]
      summary: Update an agenda item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgendaItemUpdate"
      responses:
        "200":
          description: Updated agenda item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgendaItem"
        "404":
          description: Agenda item not found
    delete:
      operationId: deleteAgendaItem
      tags: [agenda]
      summary: Delete an agenda item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Agenda item not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AgendaType:
      type: string
      enum: [cheque, vencimiento, tarea, pago, otro]
    AgendaStatus:
      type: string
      enum: [pendiente, completado]
    AgendaItem:
      type: object
      required: [id, title, dueDate, type, status, responsibleName, sectorName, description, reminderDate]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        dueDate:
          type: string
          format: date
        type:
          $ref: "#/components/schemas/AgendaType"
        status:
          $ref: "#/components/schemas/AgendaStatus"
        responsibleName:
          type: string
        sectorName:
          type: ["string", "null"]
        reminderDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
    AgendaItemInput:
      type: object
      required: [title, dueDate, type, responsibleName]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        dueDate:
          type: string
          format: date
        type:
          $ref: "#/components/schemas/AgendaType"
        responsibleName:
          type: string
          minLength: 1
        sectorName:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/AgendaStatus"
    AgendaItemUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        dueDate:
          type: string
          format: date
        type:
          $ref: "#/components/schemas/AgendaType"
        responsibleName:
          type: string
          minLength: 1
        sectorName:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/AgendaStatus"
    Sector:
      type: object
      required: [id, name, shortName]
      properties:
        id:
          type: integer
        name:
          type: string
        shortName:
          type: string
        members:
          type: integer
    CurrentUser:
      type: object
      required: [id, name, email, role, sectors]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [Administrador General, Responsable de Sector, Usuario]
        sectors:
          type: array
          items:
            $ref: "#/components/schemas/Sector"
    DashboardSummary:
      type: object
      required: [upcomingReminders, pendingGuardias, lowStockItems, recentActivityCount]
      properties:
        upcomingReminders:
          type: integer
        pendingGuardias:
          type: integer
        lowStockItems:
          type: integer
        recentActivityCount:
          type: integer
        nextReminder:
          type: ["string", "null"]
        nextReminderDate:
          type: ["string", "null"]
          format: date
    Activity:
      type: object
      required: [id, title, detail, actor, createdAt, kind]
      properties:
        id:
          type: integer
        title:
          type: string
        detail:
          type: string
        actor:
          type: string
        createdAt:
          type: string
          format: date-time
        kind:
          type: string
          enum: [agenda, guardia, inventario, instructivo, sistema]

