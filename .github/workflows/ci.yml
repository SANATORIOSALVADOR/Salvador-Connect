name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck core packages
        run: pnpm --filter @salvador/db --filter @salvador/api-zod --filter @salvador/api --if-present run typecheck

      - name: Build API
        run: pnpm --filter @salvador/api run build
        env:
          NODE_ENV: production

      - name: Build Web
        run: pnpm --filter @salvador/web run build
        env:
          NODE_ENV: production
